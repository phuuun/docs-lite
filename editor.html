<!doctype html><meta charset="utf-8"><title>Documents</title>
<style>
:root{color-scheme:dark;--bg:#000;--surf:#0D0D0E;--elev:#161618;--line:#26262A;--hi:#3F3F46;--fg:#fff;--mut:#A1A1AA;--dim:#71717A}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}::-webkit-scrollbar-thumb:hover{background:var(--hi)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
button,input{font:inherit;color:inherit}
button{background:none;color:var(--mut);border:0;border-radius:6px;padding:3px 7px;cursor:pointer}
button:hover{background:var(--elev);color:var(--fg)}

#side{width:260px;border-right:1px solid var(--line);display:flex;flex-direction:column;user-select:none}
#sh{display:flex;align-items:center;padding:16px 10px 8px 16px}#sh .eyebrow{flex:1}
#tree{flex:1;overflow:auto;padding:0 6px 8px}
.row{display:flex;align-items:center;padding:4px 8px;border-radius:6px;cursor:pointer;color:var(--mut);white-space:nowrap}
.row:hover{background:var(--elev);color:var(--fg)}.row.sel{background:var(--elev);color:var(--fg)}.row.cur{color:var(--fg);font-weight:600}
.row .ch{width:14px;color:var(--dim);font-size:10px;flex:none}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
.row input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--hi);border-radius:4px;padding:1px 5px;outline:none;color:var(--fg)}

#menu{display:none;position:fixed;z-index:9;min-width:160px;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 8px 24px #000a}
#menu div{padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--mut)}#menu div:hover{background:var(--elev);color:var(--fg)}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#head{display:flex;align-items:center;padding:14px 24px 6px}
#crumb{font-size:12px;color:var(--dim);letter-spacing:.3px}#crumb b{color:var(--fg);font-weight:600}
#msg{margin-left:auto;font-size:12px;color:var(--dim)}
#wrap{position:relative;flex:1;min-height:0}
#ed,#hl{position:absolute;inset:0;width:100%;height:100%;margin:0;border:0;outline:none;resize:none;
 padding:36px max(32px,calc((100% - 760px)/2)) 120px;font:var(--fs,18px)/1.8 Georgia,"Iowan Old Style",serif;white-space:pre-wrap;overflow-wrap:break-word}
#ed{background:transparent;color:var(--fg);z-index:1;caret-color:var(--fg)}
#ed::placeholder{color:var(--dim)}
#hl{color:transparent;overflow:auto;pointer-events:none}
#hl mark{background:var(--line);color:transparent;border-radius:2px}#hl mark.on{background:var(--hi)}
#find{display:none;position:absolute;top:10px;right:24px;z-index:2;align-items:center;gap:6px;background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:4px 6px 4px 14px}
#find input{background:none;border:0;outline:none;width:180px}
#find span{color:var(--dim);font-size:12px;min-width:48px;text-align:right}

#foot{display:flex;align-items:center;gap:16px;padding:8px 24px;border-top:1px solid var(--line);font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim)}
#goalbox{margin-left:auto;display:flex;align-items:center;gap:6px}
#goal{width:64px;background:none;border:0;border-bottom:1px solid var(--line);text-align:center;outline:none;color:var(--fg)}
#goal:focus{border-color:var(--hi)}
#bar{width:90px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}#fill{height:100%;width:0;background:var(--fg)}
</style>
<div id="menu"></div>
<div id="side">
 <div id="sh"><span class="eyebrow">Documents</span>
  <button title="Import .docx / .html / .txt" onclick="importFile()">⇪</button></div>
 <div id="tree"></div>
</div>
<div id="main">
 <div id="head"><span id="crumb"></span><span id="msg"></span></div>
 <div id="wrap">
  <div id="hl"></div>
  <textarea id="ed" spellcheck="false" disabled placeholder="Pick a file on the left, or make a new one."></textarea>
  <div id="find"><input id="q" placeholder="Find" spellcheck="false"><span id="cnt"></span><button onclick="step(-1)">↑</button><button onclick="step(1)">↓</button><button onclick="closeFind()">✕</button></div>
 </div>
 <div id="foot"><span id="words"></span>
  <div id="goalbox">Written <span id="wr">0</span> / <input id="goal" type="number" min="1" title="Words to write per session (click to change)"><div id="bar"><div id="fill"></div></div></div></div>
</div>
<script>
const $=id=>document.getElementById(id), ed=$('ed'), hl=$('hl');
let seq=0, wait={}, cur=null, sel='', open=new Set(['']), cache={}, editing=null, dirty=false, timer, base=0, matches=[], mi=0;
const call=(op,a={})=>new Promise(r=>{const id=++seq;wait[id]=r;webkit.messageHandlers.bridge.postMessage(JSON.stringify({id,op,...a}))});
function onPy(id,out){const r=wait[id];delete wait[id];r&&r(out)}
async function ok(op,a){const r=await call(op,a);if(r.err){flash(r.err);throw r.err}return r.ok}
let ft;function flash(t){$('msg').textContent=t;clearTimeout(ft);ft=setTimeout(()=>$('msg').textContent='',4000)}
const store=(k,v)=>{try{if(v===undefined)return localStorage[k];localStorage[k]=v}catch(e){}};
const dirname=p=>p.includes('/')?p.slice(0,p.lastIndexOf('/')):'', basename=p=>p.slice(p.lastIndexOf('/')+1);
const count=t=>(t=t.trim())?t.split(/\s+/).length:0;

/* ---------- tree ---------- */
async function fetchDir(d){try{cache[d]=await ok('ls',{path:d})}catch(e){open.delete(d);delete cache[d]}}
async function refresh(){await Promise.all([...open].map(fetchDir));render()}
function render(){
 const t=$('tree');t.innerHTML='';
 const inp=(val,commit)=>{const i=document.createElement('input');i.value=val;let done=false;
  const end=go=>{if(done)return;done=true;const v=i.value.trim();editing=null;go&&v?commit(v):render()};
  i.onkeydown=e=>{if(e.key=='Enter')end(true);else if(e.key=='Escape')end(false)};i.onblur=()=>end(true);
  i.onclick=e=>e.stopPropagation();setTimeout(()=>{i.focus();i.select()});return i};
 (function walk(d,depth){
  if(editing&&editing.kind=='new'&&editing.parent==d){
   const r=document.createElement('div');r.className='row';r.style.paddingLeft=8+depth*14+'px';
   const e=editing;r.innerHTML='<span class="ch"></span>';r.append(inp('',n=>create(n,e.parent,e.dir)));t.append(r)}
  (cache[d]||[]).forEach(it=>{
   const p=d?d+'/'+it.name:it.name, r=document.createElement('div');
   r.className='row'+(p==sel?' sel':'')+(p==cur?' cur':'');r.style.paddingLeft=8+depth*14+'px';
   const ch=document.createElement('span');ch.className='ch';ch.textContent=it.dir?(open.has(p)?'▾':'▸'):'';r.append(ch);
   if(editing&&editing.kind=='rename'&&editing.path==p)r.append(inp(it.name,n=>rename(p,n)));
   else{const nm=document.createElement('span');nm.className='nm';nm.textContent=it.dir?it.name:it.name.replace(/\.txt$/i,'');r.append(nm)}
   r.dataset.p=p;r.onclick=()=>it.dir?toggle(p):openFile(p);t.append(r);
   if(it.dir&&open.has(p))walk(p,depth+1)});
 })('',0);
 $('crumb').innerHTML=cur?cur.split('/').slice(0,-1).map(s=>s+' / ').join('')+'<b>'+basename(cur).replace(/\.txt$/i,'')+'</b>':'';
}
async function toggle(p){sel=p;if(open.has(p))open.delete(p);else{open.add(p);await fetchDir(p)}render()}
function target(){return sel&&cache[dirname(sel)]?.find(i=>i.name==basename(sel))?.dir?sel:dirname(sel)}
async function newItem(dir){const p=target();open.add(p);if(!cache[p])await fetchDir(p);editing={kind:'new',dir,parent:p};render()}
async function create(name,parent,dir){
 try{const np=await ok('new',{path:parent,name,dir});await refresh();if(dir){sel=np;render()}else openFile(np)}catch(e){render()}}
async function rename(p,name){
 if(name==basename(p)){render();return}
 try{const np=await ok('rename',{path:p,name});
  const m=s=>s&&(s==p||s.startsWith(p+'/'))?np+s.slice(p.length):s;
  open=new Set([...open].map(m));cur=m(cur);sel=m(sel);cache={};if(cur)store('last',cur);await refresh()}catch(e){render()}}
async function del(p){
 if(!confirm('Move "'+basename(p)+'" to the trash?'))return;
 try{if(cur&&(cur==p||cur.startsWith(p+'/'))){dirty=false;cur=null;ed.value='';ed.disabled=true;stat()}
  await ok('delete',{path:p});if(sel==p)sel='';await refresh()}catch(e){}}
async function importFile(){try{const np=await ok('import',{path:target()});if(np){await refresh();openFile(np)}}catch(e){}}

/* ---------- editor ---------- */
async function openFile(p){
 await save();
 try{const text=await ok('load',{path:p});cur=p;sel=p;ed.value=text;ed.disabled=false;ed.scrollTop=0;ed.setSelectionRange(0,0);
  base=count(text);store('last',p);stat();render();if($('find').style.display=='flex')runFind(false);ed.focus()}catch(e){}}
async function save(){clearTimeout(timer);if(!dirty||!cur)return;dirty=false;
 try{await ok('save',{path:cur,text:ed.value});flash('Saved')}catch(e){dirty=true}}
ed.oninput=()=>{dirty=true;flash('Saving…');clearTimeout(timer);timer=setTimeout(save,500);stat();if($('find').style.display=='flex')runFind(false)};
ed.onscroll=()=>hl.scrollTop=ed.scrollTop;
function stat(){const t=ed.value,n=count(t),w=Math.max(0,n-base),g=+$('goal').value||1;
 $('words').textContent=n.toLocaleString()+' words · '+t.length.toLocaleString()+' characters';
 $('wr').textContent=w.toLocaleString();$('fill').style.width=Math.min(100,w/g*100)+'%'}
$('goal').value=store('goal')||500;$('goal').oninput=()=>{store('goal',$('goal').value);stat()};

/* ---------- find ---------- */
function runFind(jump=true){
 const q=$('q').value.toLowerCase(),lo=ed.value.toLowerCase();matches=[];
 if(q)for(let i=lo.indexOf(q);i>=0;i=lo.indexOf(q,i+q.length))matches.push(i);
 if(jump){const c=ed.selectionStart;mi=matches.findIndex(m=>m>=c);if(mi<0)mi=0}
 mi=Math.min(mi,Math.max(0,matches.length-1));paint(jump)}
function paint(scroll){
 const q=$('q').value.length,t=ed.value,e=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');let h='',p=0;
 matches.forEach((m,i)=>{h+=e(t.slice(p,m))+'<mark'+(i==mi?' class="on"':'')+'>'+e(t.slice(m,m+q))+'</mark>';p=m+q});
 hl.innerHTML=h+e(t.slice(p))+'​';hl.scrollTop=ed.scrollTop;
 $('cnt').textContent=matches.length?(mi+1)+'/'+matches.length:($('q').value?'0':'');
 const on=hl.querySelector('mark.on');
 if(on&&scroll){const y=on.offsetTop;if(y<ed.scrollTop+40||y>ed.scrollTop+ed.clientHeight-80)ed.scrollTop=hl.scrollTop=Math.max(0,y-ed.clientHeight/3)}}
function step(d){if(!matches.length)return;mi=(mi+d+matches.length)%matches.length;paint(true);const m=matches[mi];ed.setSelectionRange(m,m+$('q').value.length)}
function openFind(){const f=$('find');f.style.display='flex';const s=ed.value.slice(ed.selectionStart,ed.selectionEnd);if(s&&!s.includes('\n'))$('q').value=s;$('q').focus();$('q').select();runFind()}
function closeFind(){$('find').style.display='none';hl.innerHTML='';matches=[];ed.focus()}
$('q').oninput=()=>runFind();
$('q').onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();step(e.shiftKey?-1:1)}else if(e.key=='Escape')closeFind()};

/* ---------- right-click menu ---------- */
const menu=$('menu'), hideMenu=()=>menu.style.display='none';
function showMenu(e){
 const row=e.target.closest('.row');sel=row?row.dataset.p??'':'';render();
 const items=[['New file',()=>newItem(false)],['New folder',()=>newItem(true)]];
 if(sel)items.push(['Rename',()=>{editing={kind:'rename',path:sel};render()}],['Delete',()=>del(sel)]);
 items.push(null,['Refresh',refresh]);
 menu.innerHTML='';items.forEach(it=>{if(!it)return menu.append(document.createElement('hr'));
  const d=document.createElement('div');d.textContent=it[0];d.onclick=()=>{hideMenu();it[1]()};menu.append(d)});
 menu.style.display='block';
 menu.style.left=Math.min(e.clientX,innerWidth-menu.offsetWidth-6)+'px';menu.style.top=Math.min(e.clientY,innerHeight-menu.offsetHeight-6)+'px'}
addEventListener('contextmenu',e=>{if(e.target.closest('#tree')){e.preventDefault();showMenu(e)}else if(!e.target.closest('#ed,input'))e.preventDefault()});
addEventListener('mousedown',e=>{if(!menu.contains(e.target))hideMenu()});
addEventListener('blur',hideMenu);addEventListener('resize',hideMenu);

/* ---------- zoom (editor text only) ---------- */
let fs=+store('fs')||18;
function zoom(n){fs=Math.min(48,Math.max(10,n));document.documentElement.style.setProperty('--fs',fs+'px');store('fs',fs);if($('find').style.display=='flex')paint(false)}
zoom(fs);
addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();zoom(fs+(e.deltaY<0?1:-1))}},{passive:false});

/* ---------- keys ---------- */
addEventListener('keydown',e=>{
 const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
 if(e.key=='Escape')hideMenu();
 if(e.ctrlKey&&(e.key=='='||e.key=='+')){e.preventDefault();zoom(fs+1);return}
 if(e.ctrlKey&&(e.key=='-'||e.key=='_')){e.preventDefault();zoom(fs-1);return}
 if(e.ctrlKey&&e.key=='0'){e.preventDefault();zoom(18);return}

 if(e.ctrlKey&&e.key=='s'){e.preventDefault();save()}
 else if(e.ctrlKey&&e.key=='f'&&cur){e.preventDefault();openFind()}
 else if(e.ctrlKey&&e.key=='n'){e.preventDefault();newItem(false)}
 else if(!typing&&sel&&e.key=='F2'){editing={kind:'rename',path:sel};render()}
 else if(!typing&&sel&&e.key=='Delete')del(sel)});

(async()=>{await refresh();const h=decodeURIComponent(location.hash.slice(1))||store('last');
 if(h){const d=dirname(h),parts=d.split('/').filter(Boolean);let a='';parts.forEach(s=>{a=a?a+'/'+s:s;open.add(a)});await refresh();
  if(cache[d]?.some(i=>i.name==basename(h)))openFile(h)}
 stat()})();
</script>
